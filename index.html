<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#07140c" />
  <meta name="description" content="Galaxy Estate Field Set Mixer — randomize players into sets of 3." />
  <title>Galaxy Estate Field Set Mixer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Manrope:wght@400;500;600;700;800&family=Syne:wght@600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --pitch: #07140c;
      --pitch-2: #0c1f14;
      --grass: #163821;
      --line: rgba(232, 245, 220, 0.14);
      --cream: #eef6e4;
      --mute: #9bb39a;
      --gold: #e7c56a;
      --gold-2: #f3dc97;
      --green: #7dff9a;
      --panel: rgba(10, 28, 18, 0.72);
      --shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Manrope, system-ui, sans-serif;
      color: var(--cream);
      background:
        radial-gradient(1200px 700px at 50% -20%, rgba(231, 197, 106, 0.16), transparent 55%),
        radial-gradient(900px 500px at 100% 10%, rgba(125, 255, 154, 0.08), transparent 50%),
        linear-gradient(180deg, #06110b 0%, #07140c 40%, #0a1c12 100%);
      line-height: 1.5;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(238, 246, 228, 0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(238, 246, 228, 0.04) 1px, transparent 1px);
      background-size: 72px 72px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
      opacity: 0.45;
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 118%, transparent 42%, rgba(125, 255, 154, 0.07) 43%, transparent 44%),
        radial-gradient(circle at 18% 12%, rgba(255,255,255,0.16) 0 1px, transparent 2px),
        radial-gradient(circle at 72% 18%, rgba(255,255,255,0.12) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 64%, rgba(255,255,255,0.1) 0 1px, transparent 2px);
    }

    .wrap {
      position: relative;
      z-index: 1;
      width: min(1080px, calc(100% - 32px));
      margin: 0 auto;
      padding: 28px 0 80px;
    }

    header {
      display: grid;
      gap: 18px;
      margin-bottom: 28px;
    }

    .kicker {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: var(--gold);
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .kicker i {
      width: 28px;
      height: 1px;
      background: var(--gold);
      display: inline-block;
    }

    h1 {
      font-family: Syne, sans-serif;
      font-size: clamp(2.1rem, 7vw, 4.4rem);
      font-weight: 800;
      line-height: 0.92;
      letter-spacing: -0.05em;
      max-width: 12ch;
    }

    h1 span {
      display: block;
      color: var(--gold-2);
    }

    .lede {
      max-width: 36rem;
      color: var(--mute);
      font-size: 1.02rem;
      font-weight: 500;
    }

    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      padding: 22px;
      box-shadow: var(--shadow);
      backdrop-filter: blur(18px);
    }

    .label {
      display: block;
      margin-bottom: 10px;
      font-size: 0.72rem;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--gold);
    }

    textarea {
      width: 100%;
      min-height: 190px;
      resize: vertical;
      border: 1px solid rgba(238, 246, 228, 0.1);
      background: rgba(4, 14, 9, 0.65);
      color: var(--cream);
      border-radius: 20px;
      padding: 16px 16px;
      font: 500 1.02rem/1.6 Manrope, sans-serif;
      outline: none;
    }

    textarea::placeholder { color: #6f8a72; }

    textarea:focus {
      border-color: rgba(231, 197, 106, 0.55);
      box-shadow: 0 0 0 5px rgba(231, 197, 106, 0.12);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px 16px;
      margin-top: 12px;
      color: var(--mute);
      font-size: 0.92rem;
    }

    .meta strong {
      color: var(--cream);
      font-variant-numeric: tabular-nums;
    }

    .controls {
      display: grid;
      gap: 18px;
      margin-top: 20px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip, button {
      font-family: Manrope, sans-serif;
      cursor: pointer;
    }

    .chip {
      min-width: 44px;
      border: 1px solid rgba(238, 246, 228, 0.12);
      background: rgba(7, 20, 12, 0.7);
      color: var(--cream);
      border-radius: 999px;
      padding: 9px 14px;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .chip.active {
      background: var(--gold);
      color: #1a1404;
      border-color: transparent;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      border: 0;
      border-radius: 16px;
      padding: 13px 18px;
      font-size: 0.95rem;
      font-weight: 800;
    }

    .primary {
      background: linear-gradient(180deg, var(--gold-2), var(--gold));
      color: #1a1404;
      box-shadow: 0 12px 28px rgba(231, 197, 106, 0.22);
    }

    .ghost {
      background: rgba(238, 246, 228, 0.05);
      color: var(--cream);
      border: 1px solid var(--line);
    }

    .danger { color: #ffb4b4; }

    button:hover { transform: translateY(-1px); }
    button:active { transform: translateY(1px); }

    .status {
      min-height: 1.3em;
      margin-top: 14px;
      color: var(--mute);
      font-size: 0.92rem;
    }

    .results {
      display: none;
      margin-top: 26px;
    }

    .results.show { display: block; }

    .results-head {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 14px;
      margin-bottom: 16px;
    }

    .results-head h2 {
      font-family: Syne, sans-serif;
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      letter-spacing: -0.04em;
    }

    .sub { color: var(--mute); font-weight: 500; }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
      gap: 14px;
    }

    .set-card {
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 24px;
      background:
        linear-gradient(180deg, rgba(255,255,255,0.04), transparent 28%),
        rgba(8, 22, 14, 0.88);
      animation: rise 0.45s ease both;
    }

    .set-card.bench {
      border-style: dashed;
      background: rgba(8, 22, 14, 0.55);
    }

    .set-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding: 16px 16px 8px;
    }

    .set-top b {
      font-family: Bebas Neue, sans-serif;
      font-size: 1.7rem;
      letter-spacing: 0.06em;
      font-weight: 400;
    }

    .set-top span {
      color: var(--mute);
      font-size: 0.75rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .players {
      list-style: none;
      padding: 6px 10px 14px;
    }

    .players li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 8px;
      border-top: 1px solid rgba(238, 246, 228, 0.06);
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .num {
      font-family: Bebas Neue, sans-serif;
      width: 28px;
      color: var(--gold);
      font-size: 1.15rem;
      letter-spacing: 0.04em;
    }

    footer {
      margin-top: 34px;
      color: var(--mute);
      font-size: 0.86rem;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%) translateY(16px);
      background: var(--cream);
      color: #102016;
      font-weight: 800;
      padding: 11px 16px;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 640px) {
      .wrap { width: min(1080px, calc(100% - 18px)); padding-top: 18px; }
      .panel { padding: 16px; border-radius: 22px; }
      textarea { min-height: 160px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="kicker"><i></i> Galaxy Estate Field</div>
      <h1>Set Mixer <span>for the night pitch.</span></h1>
      <p class="lede">Drop the names. We’ll shuffle everyone into clean sets of three — ready to play, no arguing, no captains.</p>
    </header>

    <section class="panel">
      <label class="label" for="names">Tonight’s players</label>
      <textarea id="names" placeholder="One name per line, or separate with commas"></textarea>
      <div class="meta">
        <div><strong id="playerCount">0</strong> ready</div>
        <div>15 → 5 sets · 12 → 4 · 9 → 3 · 6 → 2</div>
      </div>

      <div class="controls">
        <div>
          <span class="label">Players per set</span>
          <div class="chips" id="sizeChips"></div>
        </div>
        <div class="actions">
          <button class="primary" id="mixBtn">Mix sets</button>
          <button class="ghost" id="againBtn">Shuffle again</button>
          <button class="ghost danger" id="clearBtn">Clear</button>
        </div>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section class="results" id="results">
      <div class="results-head">
        <div>
          <h2 id="resultsTitle">Your sets</h2>
          <p class="sub" id="resultsSub"></p>
        </div>
        <button class="ghost" id="copyBtn">Copy for WhatsApp</button>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <footer>Names stay on this device.</footer>
  </div>

  <div class="toast" id="toast">Copied</div>

  <script>
    const SIZE_OPTIONS = [2, 3, 4, 5, 6];
    const COLORS = ["#e7c56a", "#7dff9a", "#9ad7ff", "#d2b6ff", "#ffb4c4", "#ffd27a", "#7ee0d6"];

    // Silent avoid list (not shown on page): Uthman never shares a set with these
    const UTHMAN_KEYS = ["uthman", "usman", "osman"];
    const BLOCKED_WITH_UTHMAN = [
      "hypeman", "dhino", "ejeh", "eje", "ak",
      "korede", "ranking", "olaranking", "idowu"
    ];

    const namesEl = document.getElementById("names");
    const countEl = document.getElementById("playerCount");
    const chipsEl = document.getElementById("sizeChips");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const gridEl = document.getElementById("grid");
    const titleEl = document.getElementById("resultsTitle");
    const subEl = document.getElementById("resultsSub");
    const toastEl = document.getElementById("toast");

    let setSize = 3;
    let lastSets = null;

    function parseNames(raw) {
      return raw
        .split(/[\n,;]+/)
        .map((n) => n.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function normKey(name) {
      return name.toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function isUthman(name) {
      return UTHMAN_KEYS.includes(normKey(name));
    }

    function isBlockedWithUthman(name) {
      return BLOCKED_WITH_UTHMAN.includes(normKey(name));
    }

    function uniquePreserve(list) {
      const seen = new Set();
      const out = [];
      for (const name of list) {
        const key = normKey(name);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(name);
      }
      return out;
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function teamHasConflict(team) {
      const hasU = team.some(isUthman);
      const hasB = team.some(isBlockedWithUthman);
      return hasU && hasB;
    }

    function groupsHaveConflict(sets, leftover) {
      return sets.some(teamHasConflict) || teamHasConflict(leftover);
    }

    function chunkList(list, size) {
      const sets = [];
      const fullCount = Math.floor(list.length / size);
      for (let i = 0; i < fullCount; i++) {
        sets.push(list.slice(i * size, i * size + size));
      }
      return { sets, leftover: list.slice(fullCount * size) };
    }

    // Place Uthman with only non-blocked players; blocked go elsewhere
    function groupWithAvoid(players, size) {
      const uthman = players.filter(isUthman);
      const blocked = players.filter(isBlockedWithUthman);
      const neutral = players.filter((p) => !isUthman(p) && !isBlockedWithUthman(p));

      // Try pure random shuffles first (fair when constraint is easy)
      for (let attempt = 0; attempt < 80; attempt++) {
        const shuffled = shuffle(players);
        const result = chunkList(shuffled, size);
        if (!groupsHaveConflict(result.sets, result.leftover)) {
          return { ...result, total: players.length, size, avoided: true };
        }
      }

      // Constructive fallback: seat Uthman with neutrals only
      const nPool = shuffle(neutral);
      const bPool = shuffle(blocked);
      const uPool = shuffle(uthman);
      const sets = [];
      let leftover = [];

      while (uPool.length) {
        const team = [uPool.shift()];
        while (team.length < size && nPool.length) team.push(nPool.shift());
        if (team.length === size) sets.push(shuffle(team));
        else leftover = leftover.concat(team);
      }

      const rest = shuffle(nPool.concat(bPool));
      const restChunk = chunkList(rest, size);
      sets.push(...restChunk.sets);
      leftover = leftover.concat(restChunk.leftover);

      // Final safety: if leftover still conflicts, move blocked off Uthman's leftover
      if (teamHasConflict(leftover)) {
        const keep = leftover.filter((p) => !isBlockedWithUthman(p));
        const move = leftover.filter(isBlockedWithUthman);
        leftover = keep;
        if (sets.length && move.length) {
          // push blocked into other sets if space, else keep on bench alone
          leftover = leftover.concat(move);
        } else {
          leftover = leftover.concat(move);
        }
      }

      return { sets, leftover, total: players.length, size, avoided: true };
    }

    function groupPlayers(players, size) {
      const needsAvoid =
        players.some(isUthman) && players.some(isBlockedWithUthman);
      if (!needsAvoid) {
        const shuffled = shuffle(players);
        const result = chunkList(shuffled, size);
        return { ...result, total: players.length, size, avoided: false };
      }
      return groupWithAvoid(players, size);
    }

    function updateCount() {
      countEl.textContent = uniquePreserve(parseNames(namesEl.value)).length;
      localStorage.setItem("setmixer-names", namesEl.value);
    }

    function renderChips() {
      chipsEl.innerHTML = "";
      SIZE_OPTIONS.forEach((n) => {
        const b = document.createElement("button");
        b.className = "chip" + (n === setSize ? " active" : "");
        b.type = "button";
        b.textContent = n === 3 ? "3 default" : String(n);
        b.addEventListener("click", () => {
          setSize = n;
          localStorage.setItem("setmixer-size-v2", String(n));
          renderChips();
        });
        chipsEl.appendChild(b);
      });
    }

    function renderResults(data) {
      lastSets = data;
      const { sets, leftover, total, size } = data;
      gridEl.innerHTML = "";

      if (!total) {
        resultsEl.classList.remove("show");
        statusEl.textContent = "Add names first.";
        return;
      }

      titleEl.textContent = sets.length
        ? `${sets.length} set${sets.length === 1 ? "" : "s"} ready`
        : "Not enough for a full set";

      subEl.textContent = leftover.length
        ? `${total} players · ${size} per set · ${leftover.length} on the bench`
        : `${total} players · ${size} per set`;

      sets.forEach((team, i) => {
        gridEl.appendChild(makeCard(`Set ${String(i + 1).padStart(2, "0")}`, team, COLORS[i % COLORS.length], false, i));
      });

      if (leftover.length) {
        gridEl.appendChild(makeCard("Bench", leftover, "#9bb39a", true, sets.length));
      }

      resultsEl.classList.add("show");
      statusEl.textContent = leftover.length
        ? "Full sets are ready. Bench plays next rotation."
        : "Everyone is in. Shuffle again for a new mix.";
    }

    function makeCard(title, team, color, bench, delay) {
      const card = document.createElement("article");
      card.className = "set-card" + (bench ? " bench" : "");
      card.style.animationDelay = `${delay * 50}ms`;
      card.innerHTML = `
        <div class="set-top" style="color:${color}">
          <b>${title}</b>
          <span>${team.length} player${team.length === 1 ? "" : "s"}</span>
        </div>
        <ul class="players">
          ${team.map((p, i) => `<li><span class="num">${String(i + 1).padStart(2, "0")}</span>${escapeHtml(p)}</li>`).join("")}
        </ul>
      `;
      return card;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function mix() {
      const players = uniquePreserve(parseNames(namesEl.value));
      if (!players.length) {
        renderResults({ sets: [], leftover: [], total: 0, size: setSize });
        return;
      }
      renderResults(groupPlayers(players, setSize));
    }

    function copyText() {
      if (!lastSets || !lastSets.total) return;
      const lines = [];
      lastSets.sets.forEach((team, i) => {
        lines.push(`SET ${i + 1}`);
        team.forEach((p) => lines.push(`• ${p}`));
        lines.push("");
      });
      if (lastSets.leftover.length) {
        lines.push("BENCH");
        lastSets.leftover.forEach((p) => lines.push(`• ${p}`));
      }
      const text = lines.join("\n").trim();
      navigator.clipboard.writeText(text).then(() => showToast("Copied sets")).catch(() => {
        prompt("Copy this:", text);
      });
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    namesEl.addEventListener("input", updateCount);
    document.getElementById("mixBtn").addEventListener("click", mix);
    document.getElementById("againBtn").addEventListener("click", mix);
    document.getElementById("copyBtn").addEventListener("click", copyText);
    document.getElementById("clearBtn").addEventListener("click", () => {
      namesEl.value = "";
      updateCount();
      resultsEl.classList.remove("show");
      statusEl.textContent = "";
      lastSets = null;
    });

    const savedNames = localStorage.getItem("setmixer-names");
    const savedSize = Number(localStorage.getItem("setmixer-size-v2"));
    if (savedNames) namesEl.value = savedNames;
    if (SIZE_OPTIONS.includes(savedSize)) setSize = savedSize;
    renderChips();
    updateCount();
  </script>
</body>
</html>
