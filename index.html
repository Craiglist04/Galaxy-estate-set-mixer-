<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0b1220" />
  <meta name="description" content="Galaxy Estate Field Set Mixer — paste names and randomly group players into sets of 3." />
  <title>Galaxy Estate Field Set Mixer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #0b1220;
      --bg-2: #101827;
      --card: #151d2e;
      --card-2: #1b2538;
      --line: rgba(255, 255, 255, 0.08);
      --text: #f4f7fb;
      --muted: #93a0b5;
      --orange: #ff6b1a;
      --orange-2: #ff8a3d;
      --green: #34d399;
      --blue: #60a5fa;
      --purple: #c084fc;
      --pink: #fb7185;
      --yellow: #fbbf24;
      --cyan: #22d3ee;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { min-height: 100%; }

    body {
      font-family: Outfit, system-ui, sans-serif;
      background:
        radial-gradient(1200px 600px at 10% -10%, rgba(255, 107, 26, 0.18), transparent 50%),
        radial-gradient(900px 500px at 100% 0%, rgba(52, 211, 153, 0.12), transparent 45%),
        var(--bg);
      color: var(--text);
      line-height: 1.45;
    }

    .wrap {
      width: min(980px, calc(100% - 28px));
      margin: 0 auto;
      padding: 22px 0 64px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo {
      width: 46px;
      height: 46px;
      border-radius: 14px;
      background: linear-gradient(145deg, var(--orange), #e11d48);
      display: grid;
      place-items: center;
      box-shadow: 0 10px 28px rgba(255, 107, 26, 0.28);
    }

    .logo svg { width: 26px; height: 26px; }

    h1 {
      font-size: clamp(1.02rem, 3.6vw, 1.32rem);
      font-weight: 800;
      letter-spacing: -0.03em;
      line-height: 1.15;
    }

    .sub {
      color: var(--muted);
      font-size: 0.88rem;
      font-weight: 500;
    }

    .panel {
      background: color-mix(in srgb, var(--card) 86%, transparent);
      border: 1px solid var(--line);
      border-radius: 22px;
      padding: 18px;
      backdrop-filter: blur(12px);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.25);
    }

    label.block {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 8px;
    }

    textarea {
      width: 100%;
      min-height: 168px;
      resize: vertical;
      border: 1px solid var(--line);
      background: #0d1524;
      color: var(--text);
      border-radius: 16px;
      padding: 14px 14px;
      font: 500 1rem/1.5 Outfit, system-ui, sans-serif;
      outline: none;
    }

    textarea:focus {
      border-color: color-mix(in srgb, var(--orange) 70%, white);
      box-shadow: 0 0 0 4px rgba(255, 107, 26, 0.15);
    }

    .meta-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 0.92rem;
      font-weight: 500;
    }

    .count strong { color: var(--text); }

    .hint { color: var(--muted); }

    .controls {
      display: grid;
      gap: 16px;
      margin-top: 16px;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .chip {
      border: 1px solid var(--line);
      background: #101827;
      color: var(--text);
      border-radius: 999px;
      padding: 8px 12px;
      font: 700 0.88rem Outfit, sans-serif;
      cursor: pointer;
    }

    .chip.active {
      background: var(--orange);
      color: #1a0b00;
      border-color: transparent;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    button {
      font: 700 0.95rem Outfit, sans-serif;
      border: 0;
      border-radius: 14px;
      padding: 12px 16px;
      cursor: pointer;
    }

    .primary {
      background: linear-gradient(180deg, var(--orange-2), var(--orange));
      color: #1a0b00;
      box-shadow: 0 10px 24px rgba(255, 107, 26, 0.28);
    }

    .ghost {
      background: var(--card-2);
      color: var(--text);
      border: 1px solid var(--line);
    }

    .danger { color: #fecaca; }

    button:active { transform: translateY(1px); }

    .status {
      margin-top: 14px;
      color: var(--muted);
      font-size: 0.92rem;
      min-height: 1.2em;
    }

    .results { margin-top: 22px; display: none; }

    .results.show { display: block; }

    .results-head {
      display: flex;
      flex-wrap: wrap;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .results-head h2 {
      font-size: 1.2rem;
      letter-spacing: -0.03em;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }

    .set-card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      animation: pop 0.35s ease both;
    }

    .set-card.bench {
      border-style: dashed;
      background: #121a2a;
    }

    .set-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px;
      font-weight: 800;
    }

    .set-top span {
      font-size: 0.75rem;
      font-weight: 700;
      opacity: 0.85;
    }

    .players {
      list-style: none;
      padding: 4px 8px 12px;
    }

    .players li {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 8px;
      border-radius: 10px;
      font-weight: 600;
    }

    .players li:nth-child(odd) { background: rgba(255,255,255,0.03); }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 22px;
      transform: translateX(-50%) translateY(20px);
      background: #ecfdf5;
      color: #064e3b;
      font-weight: 700;
      padding: 10px 14px;
      border-radius: 12px;
      opacity: 0;
      pointer-events: none;
      transition: 0.25s ease;
      z-index: 20;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    footer {
      margin-top: 28px;
      color: var(--muted);
      font-size: 0.84rem;
    }

    @keyframes pop {
      from { opacity: 0; transform: translateY(8px) scale(0.98); }
      to { opacity: 1; transform: none; }
    }

    @media (max-width: 720px) {
      header { align-items: flex-start; flex-direction: column; }
    }

    @media (max-width: 560px) {
      h1 { font-size: 1.12rem; }
      .wrap { width: min(980px, calc(100% - 18px)); }
      .panel { padding: 14px; }
      textarea { min-height: 150px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="brand">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="9" stroke="#fff" stroke-width="1.8"/>
            <path d="M12 3c2.2 2.4 3.4 5.5 3.4 9S14.2 18.6 12 21M12 3C9.8 5.4 8.6 8.5 8.6 12S9.8 18.6 12 21M3.5 9.5h17M3.5 14.5h17" stroke="#fff" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <h1>Galaxy Estate Field Set Mixer</h1>
          <p class="sub">Randomize names into sets of 3 for pickup ball</p>
        </div>
      </div>
    </header>

    <section class="panel">
      <label class="block" for="names">Players</label>
      <textarea id="names" placeholder="Paste or type names&#10;One per line, or separate with commas&#10;&#10;Ada&#10;Chidi&#10;Tunde&#10;Amaka"></textarea>
      <div class="meta-row">
        <div class="count"><strong id="playerCount">0</strong> players ready</div>
        <div class="hint">15 people → 5 sets · 12 → 4 sets · 9 → 3 sets · 6 → 2 sets</div>
      </div>

      <div class="controls">
        <div>
          <label class="block">Players per set</label>
          <div class="chips" id="sizeChips"></div>
        </div>
        <div class="actions">
          <button class="primary" id="mixBtn">Mix sets</button>
          <button class="ghost" id="againBtn">Shuffle again</button>
          <button class="ghost danger" id="clearBtn">Clear</button>
        </div>
      </div>
      <p class="status" id="status"></p>
    </section>

    <section class="results" id="results">
      <div class="results-head">
        <div>
          <h2 id="resultsTitle">Your sets</h2>
          <p class="sub" id="resultsSub"></p>
        </div>
        <div class="actions">
          <button class="ghost" id="copyBtn">Copy for WhatsApp</button>
        </div>
      </div>
      <div class="grid" id="grid"></div>
    </section>

    <footer>
      Galaxy Estate Field house rule: Usman/Uthman, Kingsley, and Neymar stay in the same set. Names never leave this page.
    </footer>
  </div>

  <div class="toast" id="toast">Copied</div>

  <script>
    const SIZE_OPTIONS = [2, 3, 4, 5, 6];
    const COLORS = ["#ff6b1a", "#34d399", "#60a5fa", "#c084fc", "#fb7185", "#fbbf24", "#22d3ee", "#fb923c"];
    const ALIASES = {
      usman: "usman",
      uthman: "usman",
      osman: "usman",
      kingsley: "kingsley",
      kingley: "kingsley",
      kingsly: "kingsley",
      neymar: "neymar",
      neymer: "neymar"
    };

    const LOCKED_KEYS = ["usman", "kingsley", "neymar"];

    const namesEl = document.getElementById("names");
    const countEl = document.getElementById("playerCount");
    const chipsEl = document.getElementById("sizeChips");
    const statusEl = document.getElementById("status");
    const resultsEl = document.getElementById("results");
    const gridEl = document.getElementById("grid");
    const titleEl = document.getElementById("resultsTitle");
    const subEl = document.getElementById("resultsSub");
    const toastEl = document.getElementById("toast");

    let setSize = 3;
    let lastSets = null;

    function parseNames(raw) {
      return raw
        .split(/[\n,;]+/)
        .map((n) => n.replace(/\s+/g, " ").trim())
        .filter(Boolean);
    }

    function normalizeKey(name) {
      const raw = name.toLowerCase().replace(/[^a-z0-9]+/g, "");
      return ALIASES[raw] || raw;
    }

    function uniquePreserve(list) {
      const seen = new Set();
      const out = [];
      for (const name of list) {
        const key = normalizeKey(name);
        if (seen.has(key)) continue;
        seen.add(key);
        out.push(name);
      }
      return out;
    }

    function isLockedName(name) {
      return LOCKED_KEYS.includes(normalizeKey(name));
    }

    function shuffle(arr) {
      const a = arr.slice();
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function chunkSets(players, size) {
      const shuffled = shuffle(players);
      const fullCount = Math.floor(shuffled.length / size);
      const sets = [];
      for (let i = 0; i < fullCount; i++) {
        sets.push(shuffled.slice(i * size, i * size + size));
      }
      return { sets, leftover: shuffled.slice(fullCount * size) };
    }

    function groupPlayers(players, size) {
      const locked = players.filter(isLockedName);
      const free = players.filter((p) => !isLockedName(p));
      const sets = [];
      let leftover = [];

      if (locked.length) {
        const lockedSets = [];
        for (let i = 0; i < locked.length; i += size) {
          lockedSets.push(locked.slice(i, i + size));
        }
        const fillPool = shuffle(free);
        lockedSets.forEach((group) => {
          while (group.length < size && fillPool.length) group.push(fillPool.shift());
          if (group.length === size) sets.push(shuffle(group));
          else leftover = leftover.concat(group);
        });
        const rest = chunkSets(fillPool, size);
        sets.push(...rest.sets);
        leftover = leftover.concat(rest.leftover);
      } else {
        const rest = chunkSets(players, size);
        sets.push(...rest.sets);
        leftover = rest.leftover;
      }

      return { sets, leftover, total: players.length, size, lockedCount: locked.length };
    }

    function updateCount() {
      const n = uniquePreserve(parseNames(namesEl.value)).length;
      countEl.textContent = n;
      localStorage.setItem("setmixer-names", namesEl.value);
    }

    function renderChips() {
      chipsEl.innerHTML = "";
      SIZE_OPTIONS.forEach((n) => {
        const b = document.createElement("button");
        b.className = "chip" + (n === setSize ? " active" : "");
        b.type = "button";
        b.textContent = n === 3 ? "3 (default)" : String(n);
        b.addEventListener("click", () => {
          setSize = n;
          localStorage.setItem("setmixer-size-v2", String(n));
          renderChips();
        });
        chipsEl.appendChild(b);
      });
    }

    function renderResults(data) {
      lastSets = data;
      const { sets, leftover, total, size } = data;
      gridEl.innerHTML = "";

      if (!total) {
        resultsEl.classList.remove("show");
        statusEl.textContent = "Add at least one name first.";
        return;
      }

      titleEl.textContent = sets.length
        ? `${sets.length} set${sets.length === 1 ? "" : "s"} ready`
        : "Not enough for a full set";

      const extra = leftover.length
        ? ` · ${leftover.length} on the bench / next rotation`
        : "";
      subEl.textContent = `${total} players · ${size} per set${extra}`;

      sets.forEach((team, i) => {
        gridEl.appendChild(makeCard(`Set ${i + 1}`, team, COLORS[i % COLORS.length], false));
      });

      if (leftover.length) {
        gridEl.appendChild(makeCard("Bench / next rotation", leftover, "#93a0b5", true));
      }

      resultsEl.classList.add("show");
      const house = data.lockedCount
        ? " House rule kept Usman/Uthman, Kingsley, and Neymar together."
        : "";
      statusEl.textContent = leftover.length
        ? "Full sets of " + size + " are ready. Remaining players can sit this round or join if a spot opens." + house
        : "Everyone is in a full set. Shuffle again if you want a new mix." + house;
    }

    function makeCard(title, team, color, bench) {
      const card = document.createElement("article");
      card.className = "set-card" + (bench ? " bench" : "");
      card.innerHTML = `
        <div class="set-top" style="background:${color}22;color:${color}">
          ${title}
          <span>${team.length} player${team.length === 1 ? "" : "s"}</span>
        </div>
        <ul class="players">
          ${team.map((p, i) => `<li><span class="dot" style="background:${color}"></span>${escapeHtml(p)}</li>`).join("")}
        </ul>
      `;
      return card;
    }

    function escapeHtml(str) {
      return str.replace(/[&<>"']/g, (c) => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function mix() {
      const players = uniquePreserve(parseNames(namesEl.value));
      if (!players.length) {
        renderResults({ sets: [], leftover: [], total: 0, size: setSize });
        return;
      }
      renderResults(groupPlayers(players, setSize));
    }

    function copyText() {
      if (!lastSets || !lastSets.total) return;
      const lines = [];
      lastSets.sets.forEach((team, i) => {
        lines.push(`SET ${i + 1}`);
        team.forEach((p) => lines.push(`• ${p}`));
        lines.push("");
      });
      if (lastSets.leftover.length) {
        lines.push("BENCH / NEXT ROTATION");
        lastSets.leftover.forEach((p) => lines.push(`• ${p}`));
      }
      const text = lines.join("\n").trim();
      navigator.clipboard.writeText(text).then(() => showToast("Copied sets")).catch(() => {
        prompt("Copy this:", text);
      });
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add("show");
      setTimeout(() => toastEl.classList.remove("show"), 1600);
    }

    namesEl.addEventListener("input", updateCount);
    document.getElementById("mixBtn").addEventListener("click", mix);
    document.getElementById("againBtn").addEventListener("click", mix);
    document.getElementById("copyBtn").addEventListener("click", copyText);
    document.getElementById("clearBtn").addEventListener("click", () => {
      namesEl.value = "";
      updateCount();
      resultsEl.classList.remove("show");
      statusEl.textContent = "";
      lastSets = null;
    });
    const savedNames = localStorage.getItem("setmixer-names");
    const savedSize = Number(localStorage.getItem("setmixer-size-v2"));
    if (savedNames) namesEl.value = savedNames;
    if (SIZE_OPTIONS.includes(savedSize)) setSize = savedSize;
    renderChips();
    updateCount();
  </script>
</body>
</html>
